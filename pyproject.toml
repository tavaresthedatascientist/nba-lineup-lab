[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineup-lab"
version = "1.0.0"
description = "Decision-tree lineup optimizer and game predictor for the 2025-26 NBA season"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tavares Martin" }]
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
fetch = ["nba_api>=1.4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
